services:
  reconx:
    build: .
    ports:
      - "8000:8000"
    environment:
      RECONX_ENV: demo
      ENABLE_LLM: ${ENABLE_LLM:-false}
      ENABLE_RAZORPAY_IMPORT: ${ENABLE_RAZORPAY_IMPORT:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_CHAT_URL: ${GROQ_CHAT_URL:-https://api.groq.com/openai/v1/chat/completions}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_RESPONSES_URL: ${OPENAI_RESPONSES_URL:-https://api.openai.com/v1/responses}
      RECONX_WEBHOOK_DB: /app/data/runtime/webhooks.sqlite3
      RECONX_REVIEW_DB: /app/data/runtime/reviews.sqlite3
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_WEBHOOK_PREVIOUS_SECRET: ${RAZORPAY_WEBHOOK_PREVIOUS_SECRET:-}
    volumes:
      - reconx-runtime:/app/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  reconx-runtime:
