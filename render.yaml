services:
  - type: web
    name: reconx-ai-finance-controller
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/23241a6749/ReconX
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: RECONX_ENV
        value: demo
      - key: ENABLE_LLM
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_CHAT_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: ENABLE_RAZORPAY_IMPORT
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true
      - key: RAZORPAY_WEBHOOK_PREVIOUS_SECRET
        value: ""
      - key: RECONX_WEBHOOK_DB
        value: /tmp/reconx-webhooks.sqlite3
      - key: RECONX_REVIEW_DB
        value: /tmp/reconx-reviews.sqlite3
